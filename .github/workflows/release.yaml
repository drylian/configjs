name: Publish Kfg package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Publish to NPM Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      
      - name: Installing dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      # No manual cleanup needed: `files: ["dist"]` in package.json already
      # limits the published tarball to the build output.

      - name: Setup Node for Publishing
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 20 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: npm obtains a short-lived OIDC token automatically
      # via `id-token: write`. Provenance is generated from the same identity.
      - name: Publishing
        run: npm publish --provenance --access public
